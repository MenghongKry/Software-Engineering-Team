spring:
  application:
    name: shop-jpa
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  h2:
    console:
      enabled: true

shop:
  currency: USD
  tax-rate: 0.10
  low-stock-threshold: 6

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-none}] %logger{36} : %msg%n"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE