spring:
  application:
    name: shop-jpa
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        # Task 5: JDBC batching (group up to 50 INSERT/UPDATE statements into one round trip)
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # default_batch_fetch_size is deliberately NOT set here: it would turn the
        # "51 statements" N+1 demo into 3 statements. DefaultBatchFetchSizeTest shows its effect.
  h2:
    console:
      enabled: true

shop:
  currency: USD
  tax-rate: 0.10
  low-stock-threshold: 6

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-none}] %logger{36} : %msg%n"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE