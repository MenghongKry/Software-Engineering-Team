# PostgreSQL in Docker (container shop-db, port 5433). The password comes from the
# DB_PASSWORD environment variable so it is never committed.
spring.datasource.url=jdbc:postgresql://localhost:5433/shop
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# not an embedded database, so the scripts only run when asked
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-postgres.sql
spring.h2.console.enabled=false
logging.level.root=INFO
logging.level.edu.itc.se.shop=INFO
# read DB_USER / DB_PASSWORD from shop/.env if it exists (run the app from the shop folder)
spring.config.import=optional:file:.env[.properties]

#Challenge
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shop}
spring.datasource.username=${DATABASE_USERNAME:shop}
spring.datasource.password=${DATABASE_PASSWORD:shop}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-orders.sql
spring.sql.init.data-locations=classpath:data-postgres.sql