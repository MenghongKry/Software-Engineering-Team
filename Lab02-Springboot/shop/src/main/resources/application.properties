spring.application.name=shop
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:shopdb

# ---- JSP views ----
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---- typed configuration: bound to config/ShopProperties and validated at start-up ----
shop.currency=USD
shop.tax-rate=0.10
shop.low-stock-threshold=6

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ---- logging: show the request id ----
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-none}] %logger{36} : %msg%n